[project]
name = "vplan"
version = "0.1.0"
description = "Nemotron-planned, physics-verified robot manipulation (Nebius x NVIDIA hackathon)"
requires-python = ">=3.10,<3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "ManipulaPy[simulation]==1.4.2",
  "pybullet==3.2.7",
  "numpy==2.2.6",
  "pydantic==2.13.5",
  "openai==3.24.0",
  "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

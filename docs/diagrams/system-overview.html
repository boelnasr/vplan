  <style>
    /* Skin: GitHub Primer functional tokens (@primer/primitives 11.10.0, light theme).
       Fonts: Primer's own system stacks, in order; no web fonts are loaded. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* bgColor-default */
      --color-paper-2: #f6f8fa;   /* bgColor-muted */
      --color-ink:     #1f2328;   /* fgColor-default */
      --color-muted:   #59636e;   /* fgColor-muted */
      --color-accent:  #0969da;   /* fgColor-accent */
      --font-sans:     "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --font-mono:     ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG keeps its readable width (min-width == viewBox width); this wrapper scrolls on narrow screens
       instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar: let the diagram scale to the sheet. Must follow the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Architecture · vplan</p>
    <h1>LLMs plan, physics verifies</h1>
    <p class="sub">Nemotron proposes a pick-and-place plan. Deterministic kinematics and physics decide whether it runs: the Verifier returns findings for repair or issues an approval token, and an independent Judge scores what was executed.</p>

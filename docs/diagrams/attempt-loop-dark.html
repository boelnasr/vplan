<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>One vplan attempt</title>
  <style>
    /* Skin: GitHub Primer functional tokens (@primer/primitives 11.10.0, dark theme).
       Fonts: Primer's own system stacks, in order; no web fonts are loaded. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0d1117;   /* bgColor-default */
      --color-paper-2: #151b23;   /* bgColor-muted */
      --color-ink:     #f0f6fc;   /* fgColor-default */
      --color-muted:   #9198a1;   /* fgColor-muted */
      --color-accent:  #4493f8;   /* fgColor-accent */
      --font-sans:     "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --font-mono:     ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG keeps its readable width (min-width == viewBox width); this wrapper scrolls on narrow screens
       instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar: let the diagram scale to the sheet. Must follow the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle · one attempt</p>
    <h1>One attempt, in repair mode</h1>
    <p class="sub">At most four planner calls (three repairs) and exactly one outcome. Only executed runs and refusals reach the Judge; every other outcome counts as a failure.</p>

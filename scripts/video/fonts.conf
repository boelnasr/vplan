<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used by record.mjs (FONTCONFIG_FILE, recorder process only): adds the Windows UI fonts the vplan UI asks for
     (Segoe UI, Consolas, Cascadia Mono), so the recording looks as the UI does on the owner's Windows machine. -->
<fontconfig>
  <cachedir>../../runs/video/fontcache</cachedir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
  <selectfont>
    <rejectfont><glob>/mnt/c/Windows/Fonts/*</glob></rejectfont>
    <acceptfont>
      <glob>/mnt/c/Windows/Fonts/segoeui*.ttf</glob>
      <glob>/mnt/c/Windows/Fonts/consola*.ttf</glob>
      <glob>/mnt/c/Windows/Fonts/CascadiaMono.ttf</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
